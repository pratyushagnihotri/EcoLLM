run:
  run_id: "latest"
  output_dir: "runs/latest"
  mode: "batch"            # batch | stream (stream runner later)
  decoding:
    temperature: 0.0
    max_tokens: 500
  constraints:
    timeout_s: 60
  repeats: 1               # repeat each (task, model) N times for variance
  random_seed: 7
  electricity_price_eur_per_kwh: 0.30

tasks:
  include:
    - "tasks/family1_qa/sample_qa.yaml"
    - "tasks/family1_qa/seds_qa_sweep.yaml"
    - "tasks/family4_codegen/sample_codegen.yaml"
    - "tasks/family2_anomaly/sample_anomaly.yaml"

models:
  # --- General instruct (you already use these) ---
  - model_id: "ollama-qwen2.5-3b-instruct"
    adapter: "ollama"
    params:
      model_name: "qwen2.5:3b-instruct"
      host: "http://localhost:11434"

  - model_id: "ollama-qwen2.5-7b-instruct"
    adapter: "ollama"
    params:
      model_name: "qwen2.5:7b-instruct"
      host: "http://localhost:11434"

  - model_id: "ollama-mistral-7b-instruct"
    adapter: "ollama"
    params:
      model_name: "mistral:7b-instruct"
      host: "http://localhost:11434"

  # --- Baselines already installed ---
  - model_id: "ollama-llama3-latest"
    adapter: "ollama"
    params:
      model_name: "llama3:latest"
      host: "http://localhost:11434"

  - model_id: "ollama-mistral-latest"
    adapter: "ollama"
    params:
      model_name: "mistral:latest"
      host: "http://localhost:11434"

  - model_id: "ollama-gemma-latest"
    adapter: "ollama"
    params:
      model_name: "gemma:latest"
      host: "http://localhost:11434"

  # --- Code-focused (good for family4_codegen) ---
  - model_id: "ollama-deepseek-coder-latest"
    adapter: "ollama"
    params:
      model_name: "deepseek-coder:latest"
      host: "http://localhost:11434"

  - model_id: "ollama-codellama-latest"
    adapter: "ollama"
    params:
      model_name: "codellama:latest"
      host: "http://localhost:11434"

  # --- Older baseline (optional, but useful reference) ---
  - model_id: "ollama-llama2-latest"
    adapter: "ollama"
    params:
      model_name: "llama2:latest"
      host: "http://localhost:11434"

  - model_id: "ollama-qwen-latest"
    adapter: "ollama"
    params:
      model_name: "qwen:latest"
      host: "http://localhost:11434"

  - model_id: "openai-gpt-4.1-mini"
    adapter: "openai"
    params:
      model_name: "gpt-4.1-mini"
      service_tier: "standard"

  - model_id: "openai-gpt-4.1"
    adapter: "openai"
    params:
      model_name: "gpt-4.1"
      service_tier: "standard"

  - model_id: "openai-o3-mini"
    adapter: "openai"
    params:
      model_name: "o3-mini"
      service_tier: "standard"
      reasoning_effort: "medium"

  - model_id: "openai-gpt-5"
    adapter: "openai"
    params:
      model_name: "gpt-5"
      service_tier: "standard"
      reasoning_effort: "medium"

  - model_id: "openai-gpt-5-codex"
    adapter: "openai"
    params:
      model_name: "gpt-5-codex"
      service_tier: "standard"
